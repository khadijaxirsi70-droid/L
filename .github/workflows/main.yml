name: Ultimate APK Build (Auto-Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Smart Preparation
      run: |
        set -e
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then echo "❌ No ZIP found!"; exit 1; fi
        unzip -q "$ZIP_FILE" -d project_root
        cd project_root
        PROJECT_DIR=$(find . -name "build.gradle.kts" -o -name "build.gradle" | head -n 1 | xargs dirname)
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    # 🔥 هذا هو السطر السحري الذي سيحل المشكلة تلقائياً 🔥
    - name: Auto-Fix Signing Error
      run: |
        cd project_root/${{ env.PROJECT_DIR }}
        find . -name "build.gradle.kts" -exec sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' {} +
        echo "✅ Removed signingConfig error successfully."

    - name: Fix Gradle Wrapper & Build
      run: |
        set -e
        cd project_root/${{ env.PROJECT_DIR }}
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
        if [ ! -f "gradlew" ]; then gradle wrapper; fi
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Final-APK
        path: project_root/**/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
